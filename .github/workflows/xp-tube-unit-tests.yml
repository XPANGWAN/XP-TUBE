name: XP-TUBE host unit tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/xp-tube-unit-tests.yml
      - scripts/prepare-xp-tube.py
      - scripts/audit-xp-tube.py
      - docs/**
      - vendor/playtube-migration/**
      - README.md
      - xp/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Build and run host unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use repository-vendored migration source
        run: |
          set -euo pipefail
          test -s vendor/playtube-migration/CMakeLists.txt
          test -s vendor/playtube-migration/LICENSE
          test -s vendor/playtube-migration/THIRD_PARTY_LICENSES
          test -s docs/SOURCE-PROVENANCE.md
          test -s docs/SOURCE-FILE-CHECKSUMS.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -delete
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config python3-pil \
            libsdl2-dev libcurl4-openssl-dev libssl-dev libfribidi-dev \
            libavcodec-dev libswscale-dev libavutil-dev libmpv-dev

      - name: Apply XP-TUBE patches and audit
        run: |
          set -euo pipefail
          export XP_TUBE_SOURCE_ROOT="$GITHUB_WORKSPACE/vendor/playtube-migration"
          python3 scripts/prepare-xp-tube.py
          python3 scripts/audit-xp-tube.py

      - name: Build unit test binary
        working-directory: vendor/playtube-migration
        run: |
          set -euo pipefail
          cmake --preset linux-debug -DXP_TUBE_USE_NATIVE_STORAGE=ON -DXP_TUBE_NATIVE_ROOT="$GITHUB_WORKSPACE/xp"
          cmake --build --preset linux-debug --config Development --target playtube_tests xp_core_result_tests xp_core_path_tests xp_core_storage_paths_tests xp_core_storage_context_tests xp_core_directory_store_tests xp_core_config_file_tests xp_core_file_store_tests xp_core_redaction_tests xp_core_logger_tests xp_core_text_tests xp_core_url_tests xp_net_http_contract_tests xp_platform_event_queue_tests xp_platform_runtime_tests xp_platform_legacy_action_tests -j2

      - name: Run unit tests
        working-directory: vendor/playtube-migration
        run: |
          set -euo pipefail
          ctest --preset linux-debug -C Development -R unit

      - name: Build and test XP-TUBE native core
        run: |
          set -euo pipefail
          cmake -S xp -B build/xp-core -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build/xp-core --parallel 2
          ctest --test-dir build/xp-core --output-on-failure

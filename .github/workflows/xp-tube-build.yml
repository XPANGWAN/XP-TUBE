name: XP-TUBE isolated PS4 build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/xp-tube-build.yml
      - scripts/prepare-xp-tube.py
      - scripts/audit-xp-tube.py
      - docs/**
      - vendor/playtube-migration/**
      - README.md
      - xp/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-tube-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-xp-tube:
    name: Build isolated XP-TUBE PS4 package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out XP-TUBE build scripts
        uses: actions/checkout@v4

      - name: Use repository-vendored migration source
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/playtube-migration/CMakeLists.txt
          test -s vendor/playtube-migration/LICENSE
          test -s vendor/playtube-migration/THIRD_PARTY_LICENSES
          test -s docs/SOURCE-PROVENANCE.md
          test -s docs/SOURCE-FILE-CHECKSUMS.txt
          test "$(grep -c 'Imported revision: 7372c068704f568bf04e1f8b41a04a2149b2e048' docs/SOURCE-PROVENANCE.md)" -eq 1

      - name: Install artwork generator dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -delete
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Apply XP-TUBE identity and account-isolation patch
        shell: bash
        run: |
          set -euo pipefail
          export XP_TUBE_SOURCE_ROOT="$GITHUB_WORKSPACE/vendor/playtube-migration"
          python3 scripts/prepare-xp-tube.py
          python3 scripts/audit-xp-tube.py
          python3 "$XP_TUBE_SOURCE_ROOT/scripts/make-ps4-art.py"
          cd "$XP_TUBE_SOURCE_ROOT"
          git diff --check
          grep -q 'XPTB00000' src/core/version.cpp
          ! grep -q 'session.importPrevious("/data/Playtube/config.json")' src/app/app.cpp
          ! grep -q 'PLTB00000\|PLTB00001\|/data/Playtube' cmake/ps4_pkg.cmake src/core/version.cpp src/app/app.cpp
          {
            echo "XP-TUBE source baseline"
            echo "XP-TUBE repository commit: $GITHUB_SHA"
            echo "Build branch: $GITHUB_REF_NAME"
            echo "Upstream commit: $(git rev-parse HEAD)"
            echo "XP-TUBE package ID: XPTB00000"
            echo "Data directory: /data/XP-TUBE"
            echo "Legacy Playtube migration: disabled"
            echo "Build dependency: pinned upstream source is still temporary and must be removed for full independence"
          } | tee "$GITHUB_WORKSPACE/xp-tube-build-manifest.txt"

      - name: Build PS4 dependencies from pinned upstream recipes
        working-directory: vendor/playtube-migration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ps4/build-deps.sh
          ./scripts/ps4/build-deps.sh
          while IFS= read -r dependency; do
            [[ -z "$dependency" || "$dependency" == \\#* ]] && continue
            package="build-deps/ps4-openorbis-${dependency}-any.pkg.tar.gz"
            test -s "$package" || {
              echo "Missing locally built dependency package: $package"
              exit 1
            }
          done < scripts/ps4/deps.txt
          echo "All PS4 dependency packages were built locally from the pinned recipes."

      - name: Build XP-TUBE PS4 package
        working-directory: vendor/playtube-migration
        env:
          PLAYTUBE_DEV: "0"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-ps4.sh
          ./scripts/build-ps4.sh
          PKG="dist/IV0001-XPTB00000_00-XPTB000000100000.pkg"
          test -s "$PKG"
          sha256sum "$PKG" | tee "$GITHUB_WORKSPACE/xp-tube-package-sha256.txt"

      - name: Create corresponding GPL source archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf xp-tube-corresponding-source.tar.gz --exclude=.git --exclude=./build --exclude=./dist -C vendor/playtube-migration .
          test -s xp-tube-corresponding-source.tar.gz

      - name: Verify package checksum and GPL source contents
        shell: bash
        run: |
          set -euo pipefail
          PKG="vendor/playtube-migration/dist/IV0001-XPTB00000_00-XPTB000000100000.pkg"
          test -s "$PKG"
          test "$(stat -c '%s' "$PKG")" -gt 1048576
          (cd vendor/playtube-migration && sha256sum --check "$GITHUB_WORKSPACE/xp-tube-package-sha256.txt")
          test -s xp-tube-build-manifest.txt
          grep -q "XP-TUBE repository commit: $GITHUB_SHA" xp-tube-build-manifest.txt
          grep -q "Build branch: $GITHUB_REF_NAME" xp-tube-build-manifest.txt
          grep -q 'XP-TUBE package ID: XPTB00000' xp-tube-build-manifest.txt
          grep -q 'Data directory: /data/XP-TUBE' xp-tube-build-manifest.txt
          tar -tzf xp-tube-corresponding-source.tar.gz > source-archive-files.txt
          grep -Eq '^\./LICENSE$' source-archive-files.txt
          grep -Eq '^\./THIRD_PARTY_LICENSES$' source-archive-files.txt
          grep -Eq '^\./resources/licenses/manifest\.txt$' source-archive-files.txt
          echo "PKG size: $(stat -c '%s' "$PKG") bytes"
          cat xp-tube-package-sha256.txt
          echo "GPL license, third-party notices, and license manifest are present."
          rm source-archive-files.txt

      - name: Upload XP-TUBE package and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: xp-tube-ps4-test
          path: |
            vendor/playtube-migration/dist/IV0001-XPTB00000_00-XPTB000000100000.pkg
            xp-tube-build-manifest.txt
            xp-tube-package-sha256.txt
            xp-tube-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 30
